name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore backend
        run: dotnet restore src/backend/ITCafe.Api/ITCafe.Api.csproj

      - name: Build backend
        run: dotnet build src/backend/ITCafe.Api/ITCafe.Api.csproj --no-restore --configuration Release

      - name: Run integration tests
        env:
          JWT_SECRET: ci-test-secret-32-chars-long!!!
          DB_PASSWORD: ci_password
          RABBITMQ_USERNAME: guest
          RABBITMQ_PASSWORD: guest
        run: dotnet test src/backend/ITCafe.Tests/ITCafe.Tests.csproj --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
